name: Build Harbor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev openssh-server
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend and types
        run: pnpm build
      - name: Rust tests
        run: cargo test -p harbor-core -p harbor-sync
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native desktop build
        run: cargo build -p harbor --release
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ matrix.os }}
          path: |
            target/release/harbor
            target/release/harbor.exe
