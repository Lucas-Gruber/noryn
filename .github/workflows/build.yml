name: Build and release Noryn

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag against every package manifest
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_version.py

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python -c 'import os; assert os.environ.get("TAURI_SIGNING_PRIVATE_KEY"), "Configure TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets before tagging a release"'

  checks:
    name: Shared quality checks
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Install test dependencies
        run: |
          npm install --global pnpm@11
          pnpm install --frozen-lockfile
          python -m venv .venv-ftp
          .venv-ftp/bin/python -m pip install -r scripts/requirements-ftp.txt
      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/check-updater-signing.py
      - name: Build and check shared frontend
        run: |
          pnpm build
          node scripts/test-view-state.mjs
          node scripts/test-live-sync.mjs
          node scripts/test-updater.mjs
          node scripts/test-vault-transfer.mjs
          node scripts/test-vault-reset.mjs
          node scripts/test-file-transfer.mjs
          node scripts/test-quick-connect.mjs
          node scripts/test-command-batch.mjs
          node scripts/test-scripts.mjs
          node scripts/test-text-edit.mjs
      - name: Release packaging tests
        run: python scripts/test-release.py
      - name: Complete Rust test suite
        run: cargo test --workspace --locked
      - name: Encrypted sync integration
        run: cargo test -p noryn-sync --locked -- --ignored
      - name: SSH, SFTP, sudo and forwarding integration
        run: bash scripts/test-ssh.sh
      - name: OTP authentication integration
        run: node scripts/test-otp.mjs
      - name: FTP and FTPS integration
        run: .venv-ftp/bin/python scripts/test-ftp.py
      - name: Formatting and lint
        run: |
          pnpm format:check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Share verified frontend with native builders
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Native packages (${{ matrix.platform }})
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            python: .venv-ftp/bin/python
            bundles: appimage,deb
          - os: windows-latest
            platform: windows
            python: .venv-ftp/Scripts/python.exe
            bundles: nsis
          - os: macos-latest
            platform: macos
            python: .venv-ftp/bin/python
            bundles: app,dmg
    # Native checks use the same release profile as packaging, never a second debug build.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:/Strawberry/perl/bin/perl.exe'
          if (-not (Test-Path $perl)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Strawberry Perl installation failed' }
          }
          & $perl -MIPC::Cmd -MLocale::Maketext::Simple -e 'print "OpenSSL Perl modules available\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Required OpenSSL Perl modules are unavailable' }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf file flatpak
      - name: Install native build dependencies
        run: |
          npm install --global pnpm@11
          pnpm install --frozen-lockfile
      - name: Restore verified frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
          digest-mismatch: error
      - name: Native file and application regression tests
        if: runner.os != 'Linux'
        run: |
          cargo test -p noryn-core --release --lib --locked local_
          cargo test -p noryn --release --lib --locked
      - name: Native transport test dependencies
        if: runner.os != 'Linux'
        run: |
          python -m venv .venv-ftp
          ${{ matrix.python }} -m pip install -r scripts/requirements-ftp.txt
      - name: Native OTP authentication integration
        if: runner.os != 'Linux'
        env:
          NORYN_TEST_PROFILE: release
        run: node scripts/test-otp.mjs
      - name: Native FTP and FTPS integration
        if: runner.os != 'Linux'
        env:
          NORYN_TEST_PROFILE: release
        run: ${{ matrix.python }} scripts/test-ftp.py
      - name: Native desktop bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Frontend was built and checked once; use exactly those assets on every OS.
        run: pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles "${{ matrix.bundles }}" -- --locked
      - name: Build Linux Flatpak bundle
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          task_runtime=$(python -c 'import json; c=json.load(open("packaging/flatpak/config.json")); print(c["runtime"] + "//" + c["runtimeVersion"])')
          flatpak install --user --noninteractive --assumeyes flathub "$task_runtime"
          python scripts/build-flatpak.py
      - name: Collect portable applications, installers and checksums
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NORYN_REQUIRE_UPDATER: '1'
          NORYN_REQUIRE_FLATPAK: '1'
        run: python scripts/stage-release.py
      - name: Upload portable application directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.portable }}
          archive: false
          if-no-files-found: error
      - name: Upload installer directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.installer }}
          archive: false
          if-no-files-found: error
      - name: Upload portable checksum directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.portable_sha256 }}
          archive: false
          if-no-files-found: error
      - name: Upload installer checksum directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.installer_sha256 }}
          archive: false
          if-no-files-found: error
      - name: Upload updater signature directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.updater_signature }}
          archive: false
          if-no-files-found: error
      - name: Upload Flatpak directly
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.flatpak }}
          archive: false
          if-no-files-found: error
      - name: Upload Flatpak checksum directly
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.flatpak_sha256 }}
          archive: false
          if-no-files-found: error
      - name: Upload updater metadata
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.updater_fragment }}
          archive: false
          if-no-files-found: error
      - name: Upload macOS updater package directly
        if: steps.assets.outputs.updater_package != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.updater_package }}
          archive: false
          if-no-files-found: error
      - name: Upload macOS updater checksum directly
        if: steps.assets.outputs.updater_package_sha256 != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.updater_package_sha256 }}
          archive: false
          if-no-files-found: error

  server-image:
    needs: [validate, desktop]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and publish server image to GHCR
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          task_version="$RELEASE_VERSION"
          [[ "$task_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          task_image="ghcr.io/${REPOSITORY,,}"
          task_docker_config=$(mktemp -d)
          export DOCKER_CONFIG="$task_docker_config"
          trap 'rm -rf -- "$task_docker_config"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          docker build --pull --label "org.opencontainers.image.source=$SOURCE_URL" --label "org.opencontainers.image.revision=$COMMIT" --label "org.opencontainers.image.version=$task_version" --tag "$task_image:$task_version" .
          docker push "$task_image:$task_version"
          if [[ "$task_version" != *-* ]]; then
            docker tag "$task_image:$task_version" "$task_image:latest"
            docker push "$task_image:latest"
          fi

  release:
    needs: [desktop, server-image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: Noryn-*
          merge-multiple: true
          # Preserve the portable .app.zip itself instead of unpacking its app directory.
          skip-decompress: true
          digest-mismatch: error
      - name: Assemble and validate the signed updater feed
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/update_manifest.py
      - name: Create GitHub Release and upload individual assets
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish-release.py
