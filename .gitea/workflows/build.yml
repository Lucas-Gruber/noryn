name: Build Noryn

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv-ftp/bin/python
          - os: windows-latest
            python: .venv-ftp/Scripts/python.exe
    # Labels must match your registered Gitea runners; Windows uses a native host runner.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://gitea.com/actions/checkout@v4
      - uses: https://gitea.com/actions/setup-node@v4
        with:
          node-version: 22
      - uses: https://gitea.com/actions/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: https://gitea.com/actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev openssh-server
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev openssh-server
          fi
      - name: Install dependencies
        run: |
          npm install --global pnpm@11
          pnpm install --frozen-lockfile
          python -m venv .venv-ftp
          ${{ matrix.python }} -m pip install -r scripts/requirements-ftp.txt
      - name: Frontend and types
        run: pnpm build
      - name: Rust tests
        run: cargo test -p harbor-core -p harbor-sync --locked
      - name: OTP authentication integration
        run: node scripts/test-otp.mjs
      - name: FTP and FTPS integration
        run: ${{ matrix.python }} scripts/test-ftp.py
      - name: Formatting and lint
        run: |
          pnpm format:check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native desktop build
        run: cargo build -p noryn --release --locked
      # Gitea-compatible artifact API; no GitHub Actions artifact service dependency.
      - uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: noryn-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/noryn
            target/release/noryn.exe
