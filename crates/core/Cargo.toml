[package]
name = "noryn-core"
version = "0.1.6"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Vendoring builds OpenSSL; the separate flag selects it over WinCNG on Windows.
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
suppaftp = { version = "12.1.1", default-features = false, features = ["native-tls"] }
polling = "3"


[target.'cfg(unix)'.dependencies]
libc = "0.2"
